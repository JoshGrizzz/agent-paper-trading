[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-broker"
version = "0.1.0"
description = "Deterministic limit-order matching core for the trading-agent experiment"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
market-data = ["yfinance==1.7.0"]

[project.scripts]
broker = "trading_broker.cli:main"
run-rollout = "trading_runner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
